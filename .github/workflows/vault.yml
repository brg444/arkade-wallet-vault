name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile
      - name: Format
        run: corepack pnpm format:check
      - name: Lint
        run: corepack pnpm exec eslint "src/**/*.{ts,tsx,js,jsx}" --max-warnings=0
      - name: Type check
        run: corepack pnpm typecheck
      - name: Contract pack
        run: |
          node -e "
            const pack = require('./src/lib/vault/contract-pack.json')
            const programs = pack.programs || {}
            const names = Object.keys(programs).sort()
            const expected = ['savings-recovery-v1', 'vault-board-v1', 'vault-policy-v1']
            if (JSON.stringify(names) !== JSON.stringify(expected)) {
              throw new Error('contract pack must contain exactly the current programs')
            }
            const savings = programs['savings-recovery-v1']
            if (!savings || savings.template !== 'phone-hww-recovery-savings-v1' || savings.enrollable !== true) {
              throw new Error('contract pack must publish the enrollable Savings program')
            }
            if (programs['vault-board-v1'].destination !== 'vault-policy-v1') {
              throw new Error('boarding must settle only to vault-policy-v1')
            }
          "
      - name: Unit tests
        run: corepack pnpm test:unit
      - name: Build vault
        run: corepack pnpm build
      - name: Production audit
        run: corepack pnpm audit --prod

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile
      - name: Install Playwright system dependencies
        run: corepack pnpm exec playwright install-deps chromium webkit
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-vault-browsers-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: corepack pnpm exec playwright install chromium webkit
      - name: Capture exact Linux visual baselines
        run: corepack pnpm exec playwright test -c playwright.vault.config.ts --grep @polish --update-snapshots=all
        env:
          CI: true
      - name: Upload exact Linux visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: vault-linux-visual-baselines
          path: src/test/e2e-vault/**/*-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 1
      - name: Vault Playwright
        run: corepack pnpm test:e2e
        env:
          CI: true
