name: Vault

on:
  workflow_dispatch:
  push:
    branches: [vault-mode]
  pull_request:
    branches: [vault-mode]

concurrency:
  group: vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile
      - name: Format
        run: corepack pnpm format:check
      - name: Lint
        run: corepack pnpm exec eslint "src/**/*.{ts,tsx,js,jsx}" --max-warnings=0
      - name: Contract pack
        run: |
          node -e "
            const pack = require('./src/lib/vault/contract-pack.json')
            const staged = pack.programs && pack.programs.staged
            if (!staged || staged.template !== 'phone-hww-recovery-staged-v6' || staged.enrollable !== true) {
              throw new Error('contract pack must publish only the live staged program')
            }
            if (pack.programs.v4 || pack.programs.v5 || pack.leftover) {
              throw new Error('leftover programs must not appear in the published pack')
            }
          "
      - name: Unit tests
        run: corepack pnpm test
      - name: Build vault
        run: corepack pnpm build:vault
      - name: Production audit
        run: |
          set +e
          corepack pnpm audit --prod > /tmp/audit.txt 2>&1
          status=$?
          cat /tmp/audit.txt
          if grep -q 'dompurify' /tmp/audit.txt; then
            echo 'dompurify must not remain vulnerable'
            exit 1
          fi
          if [ "$status" -eq 0 ]; then exit 0; fi
          if grep -q 'ws-electrumx-client' /tmp/audit.txt; then
            echo 'ws remains via @arkade-os/sdk; documented in docs/advisories.md'
            exit 0
          fi
          exit "$status"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: corepack pnpm exec playwright install chromium
      - name: Vault Playwright
        run: corepack pnpm test:e2e:vault
        env:
          CI: true
